[graph]
all-features = false
no-default-features = false

# Проверяется в CI job «Dependencies policy» (`.github/workflows/ci.yml`,
# `cargo deny check`). Локально: `cargo deny check`.

[advisories]
version = 2
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
ignore = [
  # paste 1.0.15 (unmaintained) приходит через genetlink/netlink-proto.
  "RUSTSEC-2024-0436",
  # chrono 0.4.45 (unmaintained): TODO миграция, см. .cargo/audit.toml.
  "RUSTSEC-2026-0543",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "deny"
# Дубли приходят транзитивно из экосистем (axum/tonic/opentelemetry/totp-rs).
# Список фиксирует известное состояние; новые дубли должны ломать проверку.
skip = [
  { name = "base64" },
  { name = "block-buffer" },
  { name = "chacha20" },
  { name = "cpufeatures" },
  { name = "crypto-common" },
  { name = "digest" },
  { name = "getrandom" },
  { name = "hashbrown" },
  { name = "prettyplease" },
  { name = "r-efi" },
  { name = "rand" },
  { name = "rand_core" },
  { name = "sha1" },
  { name = "sha2" },
  { name = "syn" },
  { name = "thiserror" },
  { name = "thiserror-impl" },
  { name = "windows-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/frkn-dev/netlink-packet-amnezia-wireguard"]
