[workspace]
resolver = "3"
members = [
    "backend/crates/shared",
    "backend/crates/storage",
    "backend/crates/identity",
    "backend/crates/tariffs",
    "backend/crates/network",
    "backend/crates/clients",
    "backend/crates/statistics",
    "backend/crates/orchestration",
    "backend/crates/proto",
    "backend/crates/worker",
    "backend/crates/admin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
flate2 = "1"
rand = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
jsonwebtoken = "9"
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "limit", "timeout"] }
redb = "4"
tonic = "0.14"
prost = "0.14"
ipnet = { version = "2", features = ["serde"] }
sha2 = "0.10"
subtle = "2"
