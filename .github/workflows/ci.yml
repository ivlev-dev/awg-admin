name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
          components: rustfmt, clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake protobuf-compiler pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.23.0
      - name: Audit Rust dependencies
        run: cargo audit --deny warnings
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Audit frontend dependencies
        working-directory: frontend
        run: pnpm audit --audit-level high --prod

  docker:
    name: Docker
    needs: [rust, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.admin
          push: false
          tags: awg-admin:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          tags: awg-worker:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: awg-frontend:ci

  e2e:
    name: E2E
    needs: [docker]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      E2E_BASE_URL: http://127.0.0.1:8081
      E2E_ADMIN_LOGIN: admin
      E2E_ADMIN_PASSWORD: admin12345
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          cat > .env <<EOF
          AWG_ENV=development
          AWG_MASTER_KEY=$(openssl rand -base64 32)
          AWG_JWT_SECRET=$(openssl rand -base64 48)
          AWG_ADMIN_LOGIN=admin
          AWG_ADMIN_PASSWORD=admin12345
          AWG_LOGIN_RATE_LIMIT=100
          AWG_REFRESH_RATE_LIMIT=300
          AWG_REGISTER_RATE_LIMIT=1000
          AWG_RESEND_RATE_LIMIT=1000
          EOF
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/api/v1/health >/dev/null 2>&1; then
              echo "stack is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "stack did not become healthy" >&2
          docker compose ps
          docker compose logs --no-color --tail=300
          exit 1
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium firefox
      - name: Run e2e tests
        working-directory: frontend
        run: pnpm e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans
