# Локальная разработка.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# ВНИМАНИЕ: это окружение только для разработки. Пароль seed-администратора по
# умолчанию — admin12345, dev-mailbox включён, TLS не используется. Не выносите
# порты за пределы loopback (они уже привязаны к 127.0.0.1) и не используйте
# этот файл на сервере.

services:
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      # Цель dev: toolchain + cargo-watch, без release-сборки.
      target: dev
    image: awg-admin-dev
    # Значение по умолчанию — development; AWG_ENV из .env имеет приоритет,
    # поэтому для dev не задавайте там production.
    environment:
      AWG_ENV: ${AWG_ENV:-development}
      AWG_BIND: 0.0.0.0:8080
      AWG_GRPC_BIND: 0.0.0.0:9090
      AWG_GRPC_TLS_CERT: ${AWG_GRPC_TLS_CERT:-}
      AWG_GRPC_TLS_KEY: ${AWG_GRPC_TLS_KEY:-}
      AWG_GRPC_TLS_CLIENT_CA: ${AWG_GRPC_TLS_CLIENT_CA:-}
      AWG_DB_PATH: /data/awg-admin.redb
      # В dev Traefik не запускается: запросы приходят с loopback.
      AWG_TRUSTED_PROXIES: ${AWG_TRUSTED_PROXIES:-127.0.0.1/32}
    volumes:
      # Монтируются только исходники, нужные cargo: остальной репозиторий
      # (android/, .git, docs, frontend/) в контейнер не попадает.
      - ./backend:/app/backend
      - ./Cargo.toml:/app/Cargo.toml:ro
      - ./Cargo.lock:/app/Cargo.lock:ro
      - ./.cargo:/app/.cargo:ro
      - awg-data:/data
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
    working_dir: /app
    command:
      - cargo
      - watch
      - -x
      - run -p awg-admin
    # Порты наследуются из docker-compose.yml и привязаны к 127.0.0.1.
    # Не переопределяем их здесь, чтобы не дублировать публикацию.
    restart: "no"

  frontend:
    image: node:26-bookworm-slim@sha256:5df79989ed685e09f0a98019db4cebfb22fb9df1a53c0161664a011f7ff6b0f1
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    command:
      - sh
      - -c
      # Версия pnpm берётся из packageManager в frontend/package.json.
      - corepack enable && pnpm install --frozen-lockfile && pnpm dev --host
    # Только loopback: dev-сервер Vite не публикуется в сеть.
    ports:
      - "127.0.0.1:5173:5173"
    restart: "no"

  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: awg-worker-dev
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - /lib/modules:/lib/modules:ro
      - /var/lib/awg-worker:/var/lib/awg-worker
    # Без env_file: worker получает только свои переменные и не видит секреты
    # admin (AWG_MASTER_KEY, AWG_JWT_SECRET, SMTP, платёжные ключи).
    environment:
      AWG_GRPC_URL: ${AWG_GRPC_URL:-http://127.0.0.1:9090}
      AWG_GRPC_TLS_CA: ${AWG_GRPC_TLS_CA:-}
      AWG_GRPC_TLS_DOMAIN: ${AWG_GRPC_TLS_DOMAIN:-}
      AWG_GRPC_TLS_SYSTEM_ROOTS: ${AWG_GRPC_TLS_SYSTEM_ROOTS:-false}
      AWG_GRPC_TLS_CLIENT_CERT: ${AWG_GRPC_TLS_CLIENT_CERT:-}
      AWG_GRPC_TLS_CLIENT_KEY: ${AWG_GRPC_TLS_CLIENT_KEY:-}
      AWG_NODE_ID: ${AWG_NODE_ID:-}
      AWG_NODE_TOKEN: ${AWG_NODE_TOKEN:-}
      AWG_DRY_RUN: "true"
      AWG_COUNTERS_PATH: /var/lib/awg-worker/counters.json
      AWG_STATS_INTERVAL_SECS: ${AWG_STATS_INTERVAL_SECS:-2}
    restart: "no"

volumes:
  awg-data:
  cargo-registry:
  cargo-git:
