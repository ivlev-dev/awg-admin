[package]
name = "awg-admin"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "awg-admin"
path = "src/main.rs"

[[bin]]
name = "awg-backup"
path = "src/bin/awg-backup.rs"

[dependencies]
awg-shared = { path = "../shared" }
awg-storage = { path = "../storage" }
awg-identity = { path = "../identity" }
awg-tariffs = { path = "../tariffs" }
awg-billing = { path = "../billing" }
awg-audit = { path = "../audit" }
awg-network = { path = "../network" }
awg-clients = { path = "../clients" }
awg-statistics = { path = "../statistics" }
awg-orchestration = { path = "../orchestration" }
awg-proto = { path = "../proto" }
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
futures-util = "0.3"
ipnet.workspace = true
lettre = { workspace = true, features = ["tokio1-rustls", "rustls-native-certs", "ring"] }
prometheus.workspace = true
rand.workspace = true
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-stream = "0.1"
tonic.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
url = "2"
uuid.workspace = true

[features]
default = []
test-support = []

[dev-dependencies]
awg-admin = { path = ".", features = ["test-support"] }
rcgen = "0.14"
totp-rs.workspace = true
