services:
  admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
    image: awg-admin:latest
    # Fail-closed по умолчанию: без AWG_ENV контейнер поднимается в production
    # и требует AWG_MASTER_KEY, AWG_JWT_SECRET и сменённый пароль admin.
    # Для локального запуска задайте AWG_ENV=development в .env или используйте
    # docker-compose.dev.yml.
    env_file:
      - path: .env
        required: false
    environment:
      AWG_ENV: ${AWG_ENV:-production}
      AWG_BIND: 0.0.0.0:8080
      AWG_GRPC_BIND: 0.0.0.0:9090
      # Подсеть docker-сети web: запросы от Traefik/nginx приходят из неё,
      # поэтому X-Forwarded-For учитывается и лимиты считаются по реальному IP.
      AWG_TRUSTED_PROXIES: ${AWG_TRUSTED_PROXIES:-172.30.0.0/24}
      AWG_DEV_MAIL_TOKEN: ${AWG_DEV_MAIL_TOKEN:-}
      AWG_GRPC_TLS_CERT: ${AWG_GRPC_TLS_CERT:-}
      AWG_GRPC_TLS_KEY: ${AWG_GRPC_TLS_KEY:-}
      AWG_GRPC_TLS_CLIENT_CA: ${AWG_GRPC_TLS_CLIENT_CA:-}
    volumes:
      - awg-data:/data
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Должен быть больше AWG_SHUTDOWN_GRACE_SECS (по умолчанию 10 с), иначе
    # docker пришлёт SIGKILL до завершения in-flight запросов.
    stop_grace_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin-api.rule=Host(`${AWG_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.admin-api.entrypoints=websecure"
      - "traefik.http.routers.admin-api.service=admin"
      - "traefik.http.routers.admin-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.admin-api.middlewares=admin-api-sec@docker"
      - "traefik.http.middlewares.admin-api-sec.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.admin-api-sec.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.admin-api-sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.admin-api-sec.headers.frameDeny=true"
      - "traefik.http.middlewares.admin-api-sec.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.admin-api-sec.headers.contentSecurityPolicy=default-src 'none'; frame-ancestors 'none'; base-uri 'none'"
      - "traefik.http.services.admin.loadbalancer.server.port=8080"
    networks:
      - web

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: awg-frontend:latest
    depends_on:
      admin:
        condition: service_healthy
    ports:
      - "${AWG_FRONTEND_BIND:-127.0.0.1}:8081:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${AWG_DOMAIN}`) && PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.service=frontend"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.middlewares=frontend-hsts@docker"
      - "traefik.http.middlewares.frontend-hsts.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.frontend-hsts.headers.stsIncludeSubdomains=true"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - web

  # Прокси к docker.sock с allowlist эндпоинтов: Traefik больше не монтирует
  # сокет напрямую, поэтому компрометация Traefik не даёт полный доступ к API
  # демона (нельзя создать privileged-контейнер, exec, смонтировать хост).
  docker-socket-proxy:
    image: ${DOCKER_SOCKET_PROXY_IMAGE:-tecnativa/docker-socket-proxy:3.4@sha256:027f9fa5ee70be5836eeaa10ce889d7a83f34a8db16a7f412818b92997e0beab}
    profiles: ["tls"]
    environment:
      # Только чтение тех разделов, которые нужны docker-провайдеру Traefik.
      CONTAINERS: 1
      EVENTS: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
      PING: 1
      VERSION: 1
      # Всё остальное — запрещено (в т.ч. POST/EXEC/IMAGES/VOLUMES/SECRETS).
      POST: 0
      EXEC: 0
      IMAGES: 0
      VOLUMES: 0
      INFO: 0
      SWARM: 0
      SECRETS: 0
      CONFIGS: 0
      SYSTEM: 0
      PLUGINS: 0
      NODES: 0
      BUILD: 0
      COMMIT: 0
      DISTRIBUTION: 0
      SESSION: 0
      AUTH: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      # Отдельная internal-сеть: admin/frontend не имеют доступа к Docker API.
      - docker-socket

  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d}
    profiles: ["tls"]
    depends_on:
      docker-socket-proxy:
        condition: service_started
    command:
      - sh
      - -c
      - 'if [ -n "$$TRAEFIK_ACME_EMAIL" ]; then exec traefik --configFile=/etc/traefik/traefik.yml --certificatesresolvers.letsencrypt.acme.email="$$TRAEFIK_ACME_EMAIL"; else exec traefik --configFile=/etc/traefik/traefik.yml; fi'
    ports:
      # 80 нужен для redirect на HTTPS (entrypoint web в docker/traefik.yml).
      # ACME работает по TLS-ALPN на 443, порт 80 для challenge не требуется.
      - "${AWG_TRAEFIK_HTTP_BIND:-0.0.0.0}:80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    environment:
      TRAEFIK_ACME_EMAIL: ${TRAEFIK_ACME_EMAIL:-}
    volumes:
      - ./docker/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-letsencrypt:/letsencrypt
    # Healthcheck не задан: образ Traefik не содержит curl/wget, а
    # `traefik healthcheck` требует включённого ping-entrypoint и отдельного
    # внутреннего порта. Работоспособность проверяется логами и внешним
    # `curl -kI https://${AWG_DOMAIN}/`.
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - web
      - docker-socket

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: awg-worker:latest
    profiles: ["worker"]
    network_mode: host
    # privileged нужен для netlink/tc/nft в host-сетевом стеке; no-new-privileges
    # здесь не применяется, доступ и так полный.
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - /lib/modules:/lib/modules:ro
      - /var/lib/awg-worker:/var/lib/awg-worker
    # env_file намеренно не используется: worker не должен видеть секреты admin
    # (AWG_MASTER_KEY, AWG_JWT_SECRET, SMTP, платёжные ключи и т.п.).
    environment:
      AWG_GRPC_URL: ${AWG_GRPC_URL:-http://127.0.0.1:9090}
      AWG_GRPC_TLS_CA: ${AWG_GRPC_TLS_CA:-}
      AWG_GRPC_TLS_DOMAIN: ${AWG_GRPC_TLS_DOMAIN:-}
      AWG_GRPC_TLS_SYSTEM_ROOTS: ${AWG_GRPC_TLS_SYSTEM_ROOTS:-false}
      AWG_GRPC_TLS_CLIENT_CERT: ${AWG_GRPC_TLS_CLIENT_CERT:-}
      AWG_GRPC_TLS_CLIENT_KEY: ${AWG_GRPC_TLS_CLIENT_KEY:-}
      AWG_NODE_ID: ${AWG_NODE_ID:-}
      AWG_NODE_TOKEN: ${AWG_NODE_TOKEN:-}
      AWG_DRY_RUN: ${AWG_DRY_RUN:-false}
      AWG_COUNTERS_PATH: /var/lib/awg-worker/counters.json
      AWG_STATS_INTERVAL_SECS: ${AWG_STATS_INTERVAL_SECS:-2}
    restart: unless-stopped

volumes:
  awg-data:
  traefik-letsencrypt:

networks:
  web:
    # Фиксированная подсеть: на неё опираются AWG_TRUSTED_PROXIES и правила
    # docker-сети. При смене подсети обновите AWG_TRUSTED_PROXIES.
    ipam:
      config:
        - subnet: 172.30.0.0/24
  docker-socket:
    internal: true
