name: build-aab

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        description: "Build type"
        required: true
        default: release
        options:
          - release
      flavor:
        type: choice
        description: "Product flavor"
        required: true
        default: google
        options:
          - google
    secrets:
      SIGNING_KEY_ALIAS:
        required: false
      SIGNING_KEY_PASSWORD:
        required: false
      SIGNING_STORE_PASSWORD:
        required: false
      SERVICE_ACCOUNT_JSON:
        required: false
      KEYSTORE:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  workflow_call:
    inputs:
      build_type:
        type: string
        description: "Build type"
        required: true
        default: release
      flavor:
        type: string
        description: "Product flavor"
        required: false
        default: google
    secrets:
      SIGNING_KEY_ALIAS:
        required: false
      SIGNING_KEY_PASSWORD:
        required: false
      SIGNING_STORE_PASSWORD:
        required: false
      SERVICE_ACCOUNT_JSON:
        required: false
      KEYSTORE:
        required: false
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

env:
  UPLOAD_DIR_ANDROID: android_artifacts

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE || secrets.ANDROID_KEYSTORE_BASE64 }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_STORE_FILE: 'android_keystore.jks'
      KEY_STORE_LOCATION: ${{ github.workspace }}/app/keystore/
    outputs:
      UPLOAD_DIR_ANDROID: ${{ env.UPLOAD_DIR_ANDROID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Read JDK version
        id: jdk
        run: |
          JDK_VERSION=$(sed -nE 's/^jdk[[:space:]]*=[[:space:]]*"([0-9]+)".*/\1/p' gradle/libs.versions.toml)
          echo "version=$JDK_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ steps.jdk.outputs.version }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check signing secrets
        run: |
          missing=()
          [[ -z "$KEYSTORE_BASE64" ]] && missing+=("KEYSTORE or ANDROID_KEYSTORE_BASE64")
          [[ -z "$SIGNING_STORE_PASSWORD" ]] && missing+=("SIGNING_STORE_PASSWORD or ANDROID_KEYSTORE_PASSWORD")
          [[ -z "$SIGNING_KEY_ALIAS" ]] && missing+=("SIGNING_KEY_ALIAS or ANDROID_KEY_ALIAS")
          [[ -z "$SIGNING_KEY_PASSWORD" ]] && missing+=("SIGNING_KEY_PASSWORD or ANDROID_KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing signing secrets: ${missing[*]}. See docs/ANDROID.md."
            exit 1
          fi

      - name: Decode Keystore
        run: |
          mkdir -p "$KEY_STORE_LOCATION"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEY_STORE_LOCATION$KEY_STORE_FILE"
          chmod 600 "$KEY_STORE_LOCATION$KEY_STORE_FILE"

      - name: Create keystore path env var
        if: ${{ inputs.build_type != 'debug' }}
        run: |
          store_path=${{ env.KEY_STORE_LOCATION }}${{ env.KEY_STORE_FILE }}
          echo "KEY_STORE_PATH=$store_path" >> $GITHUB_ENV

      - name: Build AAB (noSplits=true)
        run: |
          flavor=${{ inputs.flavor }}
          build_type=${{ inputs.build_type }}
          case $build_type in
            "release")
              ./gradlew :app:bundle${flavor^}Release \
                -PnoSplits=true \
                --info
              ;;
          esac

      - name: Get release AAB path
        id: aab-path
        run: |
          AAB_PATH=$(find app/build/outputs/bundle -iname "*google*release*.aab" -type f | head -1)
          if [ -z "$AAB_PATH" ]; then
            echo "Error: AAB not found!" >&2
            exit 1
          fi
          echo "Found AAB: $AAB_PATH"
          echo "path=$AAB_PATH" >> $GITHUB_OUTPUT

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v7
        with:
          name: google-play-aab
          path: ${{ steps.aab-path.outputs.path }}
          retention-days: 7
          if-no-files-found: error