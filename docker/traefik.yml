global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http3: {}
    http:
      tls: {}

providers:
  docker:
    # Traefik ходит в docker-socket-proxy (allowlist GET-эндпоинтов), а не в
    # /var/run/docker.sock: у контейнера Traefik нет доступа к хостовому сокету.
    endpoint: "tcp://docker-socket-proxy:2375"
    exposedByDefault: false
    network: web

tls:
  options:
    default:
      # Явный минимум TLS 1.2; TLS 1.3 согласуется автоматически.
      minVersion: VersionTLS12

certificatesResolvers:
  letsencrypt:
    acme:
      email: ""
      storage: "/letsencrypt/acme.json"
      tlsChallenge: {}
